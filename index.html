<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>NEXA AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#0b1020;color:#fff;overflow:hidden}

.app{width:100%;height:100vh;display:flex}

.sidebar{
    width:270px;height:100%;background:#080d18;
    border-right:1px solid #20283a;
    display:flex;flex-direction:column;padding:15px;
    flex-shrink:0;position:relative;z-index:200
}

.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}

.logo-icon,.welcome-icon,.ai-avatar{
    background:linear-gradient(135deg,#7057ff,#00c9a7)
}

.logo-icon{
    width:42px;height:42px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:bold
}

.logo-text{font-size:21px;font-weight:bold}

.new-chat{
    width:100%;padding:13px;border:1px solid #303a50;
    border-radius:11px;background:#11182a;color:#fff;
    cursor:pointer;font-size:14px;margin-bottom:22px;
    transition:.2s
}

.new-chat:hover{background:#182138}

.history-title{
    color:#7f899d;font-size:11px;text-transform:uppercase;margin:5px
}

.history{flex:1;overflow-y:auto;min-height:0}

.history-item{
    padding:11px;border-radius:9px;color:#cbd2df;
    cursor:pointer;margin-bottom:4px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;transition:.2s
}

.history-item:hover{background:#151e31}

.account{
    border-top:1px solid #20283a;padding-top:12px;
    display:flex;align-items:center;gap:10px
}

.account-avatar{
    width:37px;height:37px;border-radius:50%;
    background:#27324a;display:flex;align-items:center;
    justify-content:center
}

.account-name{font-size:13px;font-weight:bold}
.account-status{font-size:11px;color:#7d889d;margin-top:3px}

.main{
    flex:1;min-width:0;height:100%;
    display:flex;flex-direction:column
}

.header{
    height:64px;flex-shrink:0;border-bottom:1px solid #20283a;
    display:flex;align-items:center;padding:0 18px
}

.header-left{display:flex;align-items:center;gap:10px}

.mobile-menu{
    display:none;border:0;background:transparent;color:#fff;
    font-size:23px;cursor:pointer;width:40px;height:40px;
    border-radius:10px
}

.mobile-menu:hover{background:#151e31}

.ai-name{display:flex;align-items:center;gap:8px;font-weight:bold}

.online{
    width:8px;height:8px;border-radius:50%;
    background:#00d084;box-shadow:0 0 8px #00d084
}

.chat{
    flex:1;overflow-y:auto;padding:20px 15px 150px;
    scroll-behavior:smooth
}

.chat-container{width:100%;max-width:850px;margin:auto}

.welcome{
    min-height:60vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    padding:20px
}

.welcome-icon{
    width:72px;height:72px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:bold;margin-bottom:18px;
    box-shadow:0 10px 35px rgba(112,87,255,.18)
}

.welcome h1{font-size:32px;margin-bottom:10px}

.welcome p{
    color:#8d97aa;max-width:560px;line-height:1.6
}

.message{
    display:flex;gap:12px;margin-bottom:25px;
    animation:showMessage .2s ease
}

@keyframes showMessage{
    from{opacity:0;transform:translateY(5px)}
    to{opacity:1;transform:translateY(0)}
}

.message.user{justify-content:flex-end}

.avatar{
    width:36px;height:36px;min-width:36px;
    border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:bold
}

.ai-avatar{color:#fff}
.user-avatar{background:#27324a}

.message-content{
    max-width:75%;line-height:1.65;
    white-space:pre-wrap;word-break:break-word
}

.user .message-content{
    background:#1b2741;padding:11px 15px;
    border-radius:15px 15px 4px 15px
}

.ai .message-content{padding-top:5px}

.message-content a{
    color:#8e7cff;text-decoration:underline
}

.typing{display:flex;gap:5px;padding:9px 0}

.typing span{
    width:7px;height:7px;border-radius:50%;
    background:#8792a7;animation:bounce 1s infinite
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
    0%,60%,100%{transform:translateY(0)}
    30%{transform:translateY(-5px)}
}

.input-area{
    position:absolute;left:270px;right:0;bottom:0;
    padding:10px 18px 18px;
    background:linear-gradient(transparent,#0b1020 25%);
    z-index:50
}

.input-container{max-width:850px;margin:auto}

.input-box{
    display:flex;align-items:flex-end;gap:7px;padding:7px;
    background:#11182a;border:1px solid #303a50;
    border-radius:16px
}

.input-box:focus-within{
    border-color:#7057ff;
    box-shadow:0 0 0 2px rgba(112,87,255,.08)
}

textarea{
    flex:1;min-height:43px;max-height:150px;resize:none;
    border:0;outline:0;background:transparent;color:#fff;
    font-family:Arial,Helvetica,sans-serif;font-size:15px;
    padding:12px 10px;overflow-y:auto
}

textarea::placeholder{color:#727d91}

.input-button{
    width:42px;height:42px;border:0;border-radius:10px;
    background:transparent;color:#9ba5b8;cursor:pointer;
    font-size:18px;flex-shrink:0
}

.input-button:hover{background:#202b43;color:#fff}

.send-button{background:#7057ff;color:#fff}
.send-button:hover{background:#5d46e6}

.file-input{display:none}

.disclaimer{
    text-align:center;color:#626d82;font-size:10px;margin-top:7px
}

.sidebar-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.55);z-index:150
}

.sidebar-overlay.show{display:block}

@media(max-width:800px){
    .sidebar{
        position:fixed;left:-280px;top:0;bottom:0;
        z-index:200;transition:left .25s ease;
        box-shadow:10px 0 35px rgba(0,0,0,.3)
    }

    .sidebar.open{left:0}

    .mobile-menu{
        display:flex;align-items:center;justify-content:center
    }

    .input-area{
        left:0;padding:8px 8px 12px
    }

    .header{padding:0 12px}

    .message-content{max-width:85%}

    .welcome{min-height:55vh}

    .welcome h1{font-size:27px}

    .welcome p{font-size:14px}
}

@media(max-width:420px){
    .input-box{gap:4px;padding:5px;border-radius:14px}

    .input-button{
        width:38px;height:38px;font-size:16px
    }

    textarea{
        font-size:14px;padding:10px 7px
    }

    .message{gap:8px}

    .avatar{
        width:32px;height:32px;min-width:32px
    }
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">N</div>
        <div class="logo-text">NEXA AI</div>
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ Nouveau chat
    </button>

    <div class="history-title">
        Conversations
    </div>

    <div class="history" id="history"></div>

    <div class="account">
        <div class="account-avatar">👤</div>

        <div>
            <div class="account-name">Utilisateur</div>
            <div class="account-status">Compte gratuit</div>
        </div>
    </div>

</aside>

<main class="main">

    <header class="header">

        <div class="header-left">

            <button
                class="mobile-menu"
                id="mobileMenu"
                onclick="toggleSidebar()"
                aria-label="Ouvrir le menu">
                ☰
            </button>

            <div class="ai-name">
                <span class="online"></span>
                NEXA AI
            </div>

        </div>

    </header>

    <section class="chat" id="chat">

        <div class="chat-container" id="chatContainer">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">N</div>

                <h1>Bonjour 👋</h1>

                <p>
                    Je suis NEXA AI.
                    Comment puis-je vous aider aujourd'hui ?
                </p>

            </div>

        </div>

    </section>

</main>

<div class="input-area">

    <div class="input-container">

        <div class="input-box">

            <input
                type="file"
                id="fileInput"
                class="file-input"
                onchange="fileSelected(this)">

            <button
                class="input-button"
                onclick="document.getElementById('fileInput').click()"
                title="Ajouter un fichier">
                📎
            </button>

            <textarea
                id="messageInput"
                placeholder="Message à NEXA AI..."
                rows="1"
                onkeydown="handleKey(event)"
                oninput="resizeInput(this)">
            </textarea>

            <button
                class="input-button"
                title="Microphone"
                onclick="voiceInput()">
                🎙️
            </button>

            <button
                class="input-button send-button"
                title="Envoyer"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

        <div class="disclaimer">
            NEXA AI peut faire des erreurs.
            Vérifiez les informations importantes.
        </div>

    </div>

</div>

</div>

<script>
"use strict";

/* ============================================================
   CONFIGURATION
============================================================ */

const NEXA_API =
    "https://davbot-api-xw6y.vercel.app/api/ask";

const SYSTEM_PROMPT = `
Tu es NEXA AI.

Tu es un assistant intelligent, professionnel,
respectueux et utile.

Tu aides les utilisateurs dans :

- Programmation
- Développement web
- Développement mobile
- Intelligence artificielle
- Création de projets
- Études
- Rédaction
- Traduction
- Résumé
- Analyse
- Explication
- Idées
- Documents
- Technologie

Réponds toujours en français sauf si
l'utilisateur demande une autre langue.

Tes réponses doivent être claires,
utiles, naturelles et professionnelles.

Ne prétends pas avoir accès à des informations
que tu ne possèdes pas.
`;


/* ============================================================
   STOCKAGE
============================================================ */

const STORAGE = {
    conversations: "nexa_history"
};

let currentMessages = [];

let conversations =
    loadJSON(
        STORAGE.conversations,
        []
    );

let currentConversationId = null;

let notificationTimer = null;


/* ============================================================
   LOCAL STORAGE
============================================================ */

function loadJSON(key, fallback){

    try{

        const value =
            localStorage.getItem(key);

        if(!value){

            return fallback;

        }

        return JSON.parse(value);

    }catch(error){

        console.error(
            "Erreur localStorage :",
            error
        );

        return fallback;

    }

}


function saveJSON(key, value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    }catch(error){

        console.error(
            "Impossible d'enregistrer :",
            error
        );

        return false;

    }

}


/* ============================================================
   INITIALISATION
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initializeChat();

    }
);


function initializeChat(){

    loadHistory();

    const input =
        document.getElementById(
            "messageInput"
        );

    if(input){

        resizeInput(input);

        input.focus();

    }

}


/* ============================================================
   ENVOYER MESSAGE
============================================================ */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    if(!input){

        return;

    }

    const text =
        input.value.trim();

    if(!text){

        return;

    }

    input.value = "";

    resizeInput(input);

    hideWelcome();

    addMessage(
        "user",
        text
    );

    currentMessages.push({

        role: "user",

        content: text

    });

    showTyping();

    await askNexa();

}


/* ============================================================
   API NEXA AI
============================================================ */

async function askNexa(){

    try{

        const response =
            await fetch(
                NEXA_API,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        message:
                            SYSTEM_PROMPT +
                            "\n\nHistorique de la conversation :\n" +
                            JSON.stringify(currentMessages) +
                            "\n\nRéponds au dernier message de l'utilisateur."

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                "Erreur HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        removeTyping();


        const answer =

            data.answer ??

            data.message ??

            data.response ??

            data.text ??

            data.result ??

            "Je n'ai pas reçu de réponse.";


        const finalAnswer =
            String(answer);


        addMessage(
            "ai",
            finalAnswer
        );


        currentMessages.push({

            role: "assistant",

            content:
                finalAnswer

        });


        saveConversation();


    }catch(error){

        console.error(
            "NEXA API ERROR:",
            error
        );


        removeTyping();


        addMessage(
            "ai",
            "❌ Impossible de contacter NEXA AI pour le moment. Vérifiez votre connexion Internet puis réessayez."
        );

    }

}


/* ============================================================
   AJOUT MESSAGE
============================================================ */

function addMessage(type, text){

    const box =
        document.getElementById(
            "chatContainer"
        );

    if(!box){

        return;

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " +
        type;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar " +
        (
            type === "ai"
                ? "ai-avatar"
                : "user-avatar"
        );


    avatar.textContent =
        type === "ai"
            ? "N"
            : "👤";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    content.innerHTML =
        formatText(text);


    if(type === "ai"){

        div.appendChild(
            avatar
        );

        div.appendChild(
            content
        );

    }else{

        div.appendChild(
            content
        );

        div.appendChild(
            avatar
        );

    }


    box.appendChild(
        div
    );


    scrollChat();

}


/* ============================================================
   FORMATAGE TEXTE
============================================================ */

function formatText(text){

    let safe =
        String(text ?? "");


    safe =
        safe
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );


    safe =
        safe.replace(
            /(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        );


    return safe.replace(
        /\n/g,
        "<br>"
    );

}


/* ============================================================
   BIENVENUE
============================================================ */

function hideWelcome(){

    const welcome =
        document.getElementById(
            "welcome"
        );

    if(welcome){

        welcome.style.display =
            "none";

    }

}


/* ============================================================
   SCROLL
============================================================ */

function scrollChat(){

    const chat =
        document.getElementById(
            "chat"
        );

    if(!chat){

        return;

    }


    requestAnimationFrame(
        function(){

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* ============================================================
   TYPING
============================================================ */

function showTyping(){

    const box =
        document.getElementById(
            "chatContainer"
        );

    if(!box){

        return;

    }


    removeTyping();


    const div =
        document.createElement(
            "div"
        );


    div.id =
        "typing";


    div.className =
        "message ai";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar ai-avatar";


    avatar.textContent =
        "N";


    const typing =
        document.createElement(
            "div"
        );


    typing.className =
        "typing";


    for(let i = 0; i < 3; i++){

        typing.appendChild(
            document.createElement(
                "span"
            )
        );

    }


    div.appendChild(
        avatar
    );

    div.appendChild(
        typing
    );


    box.appendChild(
        div
    );


    scrollChat();

}


/* ============================================================
   REMOVE TYPING
============================================================ */

function removeTyping(){

    const typing =
        document.getElementById(
            "typing"
        );

    if(typing){

        typing.remove();

    }

}


/* ============================================================
   SAUVEGARDER CONVERSATION
============================================================ */

function saveConversation(){

    if(
        !currentMessages.length
    ){

        return;

    }


    const firstMessage =
        currentMessages.find(
            message =>
                message.role === "user"
        );


    const title =
        (
            firstMessage?.content ||
            "Nouvelle conversation"
        ).substring(
            0,
            45
        );


    const conversation = {

        id:
            currentConversationId ||
            Date.now(),

        title:
            title ||
            "Conversation",

        messages:
            currentMessages,

        date:
            new Date().toLocaleString(
                "fr-FR"
            )

    };


    const index =
        conversations.findIndex(
            item =>
                item.id ===
                conversation.id
        );


    if(index !== -1){

        conversations[index] =
            conversation;

    }else{

        conversations.unshift(
            conversation
        );

    }


    currentConversationId =
        conversation.id;


    conversations =
        conversations.slice(
            0,
            30
        );


    saveJSON(
        STORAGE.conversations,
        conversations
    );


    loadHistory();

}


/* ============================================================
   CHARGER HISTORIQUE
============================================================ */

function loadHistory(){

    const history =
        document.getElementById(
            "history"
        );

    if(!history){

        return;

    }


    conversations =
        loadJSON(
            STORAGE.conversations,
            []
        );


    history.innerHTML = "";


    if(
        !conversations.length
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "history-item";


        empty.style.color =
            "#626d82";


        empty.textContent =
            "Aucune conversation";


        history.appendChild(
            empty
        );


        return;

    }


    conversations.forEach(
        function(item){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.textContent =
                "💬 " +
                (
                    item.title ||
                    "Conversation"
                );


            div.title =
                item.title ||
                "Conversation";


            div.onclick =
                function(){

                    restoreConversation(
                        item.id
                    );

                };


            history.appendChild(
                div
            );

        }
    );

}


/* ============================================================
   RESTAURER CONVERSATION
============================================================ */

function restoreConversation(id){

    const conversation =
        conversations.find(
            item =>
                item.id === id
        );


    if(!conversation){

        return;

    }


    currentMessages =
        Array.isArray(
            conversation.messages
        )
            ? conversation.messages
            : [];


    currentConversationId =
        conversation.id;


    const box =
        document.getElementById(
            "chatContainer"
        );


    if(!box){

        return;

    }


    box.innerHTML = "";


    currentMessages.forEach(
        function(message){

            addMessage(

                message.role === "user"
                    ? "user"
                    : "ai",

                message.content

            );

        }
    );


    closeSidebar();

}


/* ============================================================
   NOUVEAU CHAT
============================================================ */

function newChat(){

    currentMessages = [];

    currentConversationId =
        null;


    removeTyping();


    const box =
        document.getElementById(
            "chatContainer"
        );


    if(!box){

        return;

    }


    box.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-icon">
                N
            </div>

            <h1>
                Bonjour 👋
            </h1>

            <p>
                Je suis NEXA AI.
                Comment puis-je vous aider aujourd'hui ?
            </p>

        </div>

    `;


    const input =
        document.getElementById(
            "messageInput"
        );


    if(input){

        input.value = "";

        resizeInput(input);

        input.focus();

    }


    closeSidebar();

}


/* ============================================================
   TOUCHE ENTRÉE
============================================================ */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* ============================================================
   REDIMENSIONNER INPUT
============================================================ */

function resizeInput(element){

    if(!element){

        return;

    }


    element.style.height =
        "auto";


    element.style.height =
        Math.min(
            element.scrollHeight,
            150
        ) +
        "px";

}


/* ============================================================
   SIDEBAR MOBILE
============================================================ */

function toggleSidebar(){

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const overlay =
        document.getElementById(
            "sidebarOverlay"
        );


    if(!sidebar){

        return;

    }


    const open =
        sidebar.classList.toggle(
            "open"
        );


    if(overlay){

        overlay.classList.toggle(
            "show",
            open
        );

    }

}


function closeSidebar(){

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const overlay =
        document.getElementById(
            "sidebarOverlay"
        );


    if(sidebar){

        sidebar.classList.remove(
            "open"
        );

    }


    if(overlay){

        overlay.classList.remove(
            "show"
        );

    }

}


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeSidebar();

        }

    }
);


/* ============================================================
   FICHIER
============================================================ */

function fileSelected(input){

    if(
        !input ||
        !input.files ||
        !input.files.length
    ){

        return;

    }


    const file =
        input.files[0];


    showNotification(
        "📎 Fichier sélectionné : " +
        file.name
    );

}


/* ============================================================
   MICROPHONE
============================================================ */

function voiceInput(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showNotification(
            "🎙️ La reconnaissance vocale n'est pas disponible sur ce navigateur."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            showNotification(
                "🎙️ Parlez maintenant..."
            );

        };


    recognition.onresult =
        function(event){

            const transcript =
                event.results[0][0].transcript;


            const input =
                document.getElementById(
                    "messageInput"
                );


            if(input){

                input.value =
                    transcript;

                resizeInput(input);

                input.focus();

            }

        };


    recognition.onerror =
        function(){

            showNotification(
                "❌ Impossible d'utiliser le microphone."
            );

        };


    try{

        recognition.start();

    }catch(error){

        console.error(error);

    }

}


/* ============================================================
   NOTIFICATION
============================================================ */

function showNotification(text){

    createTemporaryNotification(
        text
    );

}


function createTemporaryNotification(text){

    const box =
        document.createElement(
            "div"
        );


    box.textContent =
        text;


    Object.assign(
        box.style,
        {

            position:
                "fixed",

            left:
                "50%",

            bottom:
                "25px",

            transform:
                "translateX(-50%)",

            background:
                "#182138",

            color:
                "#fff",

            border:
                "1px solid #303a50",

            borderRadius:
                "10px",

            padding:
                "13px 18px",

            zIndex:
                "99999",

            fontSize:
                "13px",

            maxWidth:
                "90%",

            textAlign:
                "center"

        }
    );


    document.body.appendChild(
        box
    );


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(
            function(){

                box.remove();

            },
            3000
        );

}


/* ============================================================
   EFFACER HISTORIQUE
============================================================ */

function clearConversationHistory(){

    conversations = [];

    currentMessages = [];

    currentConversationId =
        null;


    localStorage.removeItem(
        STORAGE.conversations
    );


    loadHistory();

    newChat();

    showNotification(
        "🗑️ Historique supprimé."
    );

}


/* ============================================================
   EXPORT NEXA
============================================================ */

window.NEXA = {

    sendMessage,

    newChat,

    askNexa,

    clearConversationHistory,

    showNotification

};

</script>
